name: Build & Publish APK

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > leanback-app/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > compose-app/google-services.json

      - name: Decode default keystore
        run: |
          mkdir -p security
          echo "${{ secrets.DEFAULT_KEYSTORE_BASE64 }}" | base64 --decode > security/default_keystore

      - name: Decode Secrets.kt
        run: echo "${{ secrets.SECRETS_KT_BASE64 }}" | base64 --decode > core/src/main/kotlin/com/joshgm3z/triplerocktv/core/repository/retrofit/Secrets.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify navigation startDestination is splash screen
        run: ./gradlew leanback-app:testOnlineDebugUnitTest --tests com.joshgm3z.triplerocktv.NavigationTest

      - name: Set Environment Variables
        run: |
          echo "RELEASE_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_TAG_VERSION=v${{ github.run_number }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "GRADLE_TASK=assembleDevRelease" >> $GITHUB_ENV
            echo "RELEASE_NAME=dev-release" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "GRADLE_TASK=assembleOnlineRelease" >> $GITHUB_ENV
            echo "RELEASE_NAME=master-release" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK (:app)
        run: ./gradlew ${{ env.GRADLE_TASK }} -PversionNameOverride=${{ env.RELEASE_TAG_VERSION }} -PversionCodeOverride=${{ env.RELEASE_CODE }}

      - name: Clear Existing Release and Tag
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_NAME }}
        run: |
          gh release delete $TAG_NAME --yes || echo "No release found"
          git tag -d $TAG_NAME || echo "No local tag"
          git push --delete origin $TAG_NAME || echo "No tag found"

      - name: Prepare APK for Release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release_artifacts
          cp leanback-app/build/outputs/apk/*/release/*.apk release_artifacts/3RockTV-leanback-app.apk
          cp compose-app/build/outputs/apk/*/release/*.apk release_artifacts/3RockTV-compose-app.apk

      - name: Get Last Commit Message
        if: github.event_name != 'pull_request'
        id: last_commit
        run: echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Update Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_NAME }}
          name: ${{ env.RELEASE_TAG_VERSION }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            release_artifacts/3RockTV-leanback-app.apk
            release_artifacts/3RockTV-compose-app.apk
          body: |
            Last commit: 
            * ${{ steps.last_commit.outputs.msg }} [${{ env.SHORT_SHA }}]
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
